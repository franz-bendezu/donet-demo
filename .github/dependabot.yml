# For more details, see https://containers.dev/guide/dependabot
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      devcontainers:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      devcontainers-major:
        patterns:
          - "*"
        update-types:
          - major
